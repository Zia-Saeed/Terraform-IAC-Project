# Fill in real values and `kubectl apply -f` this BEFORE the deployments,
# or better: create it via `kubectl create secret generic ...` / External
# Secrets Operator pulling from AWS Secrets Manager instead of committing
# plaintext to git. Shown here as a template only.
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-secrets
  namespace: shopflow
type: Opaque
stringData:
  DB_USER: "postgresqlaurora"
  DB_PASSWORD: "LKJSALKJ230948KLAJSDKLJ9023"                 # RDS PostgreSQL master/user password
  DJANGO_SECRET_KEY: "hange-me-super-secret-django-key"
  JWT_SECRET_KEY: "change-me-super-secret-jwt-key"               # must match across all services
  INTERNAL_SERVICE_TOKEN: "change-me-internal-service-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopflow-config
  namespace: shopflow
data:
  # RDS PostgreSQL endpoint - one shared instance, one database per service (see README)
  DB_HOST: "prod-iac-prod-db-micro-services.cluster-ccjceuwuiayk.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DJANGO_DEBUG: "True"
  ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "True"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://localhost:3000"
  # In-cluster Service DNS (ClusterIP Services defined below)
  USER_SERVICE_URL: "http://user-service.shopflow.svc.cluster.local:8001"
  PRODUCT_SERVICE_URL: "http://product-service.shopflow.svc.cluster.local:8002"
  ORDER_SERVICE_URL: "http://order-service.shopflow.svc.cluster.local:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service.shopflow.svc.cluster.local:8004"
  # Product image storage - S3 instead of local disk, so product-service can
  # safely run multiple replicas (see USE_S3_STORAGE in productservice/settings.py).
  # No AWS access keys here on purpose - see the ServiceAccount/IRSA note in
  # k8s/03-product-service.yaml for how the pod authenticates to S3 instead.
  USE_S3_STORAGE: "True"
  AWS_STORAGE_BUCKET_NAME: "product-bucket-microservices-practise-3290829038"   # REPLACE with your actual bucket name
  AWS_S3_REGION_NAME: "us-east-1"                       # REPLACE with your bucket's region
  AWS_S3_CUSTOM_DOMAIN: "" 
  
