# Product images live in S3 now (USE_S3_STORAGE=True in shopflow-config),
# so this Deployment is free to run multiple replicas safely - no PVC, no
# per-pod disk, no "which replica actually has this file" problem.
#
# The pod authenticates to S3 via IRSA (IAM Roles for Service Accounts) -
# boto3 automatically picks up temporary credentials injected by EKS's Pod
# Identity webhook, so no AWS_ACCESS_KEY_ID/SECRET ever needs to exist as a
# Kubernetes Secret. This role comes from terraform/s3-media/ (the
# product_service_role_arn output) - not from eksctl create iamserviceaccount,
# since Terraform already creates it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: shopflow
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::825765392987:role/<paste terraform output product_service_role_arn here>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
  labels: { app: product-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          # Your real ECR image - replace REGION with wherever you pushed it
          # (us-east-1, matching your cluster's region per variable.tf)
          image: 825765392987.dkr.ecr.us-east-1.amazonaws.com/shopflow/product-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets }
          env:
            - name: DB_NAME
              value: "productdb"
          readinessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  selector: { app: product-service }
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP