# Product images live in S3 now (USE_S3_STORAGE=True in shopflow-config),
# so this Deployment is free to run multiple replicas safely - no PVC, no
# per-pod disk, no "which replica actually has this file" problem.
#
# The pod authenticates to S3 via IRSA (IAM Roles for Service Accounts) -
# boto3 automatically picks up temporary credentials injected by EKS's Pod
# Identity webhook, so no AWS_ACCESS_KEY_ID/SECRET ever needs to exist as a
# Kubernetes Secret. One-time setup (via eksctl, run once per cluster):
#
#   eksctl create iamserviceaccount \
#     --cluster <your-cluster-name> \
#     --namespace shopflow \
#     --name product-service-sa \
#     --attach-policy-arn arn:aws:iam::<ACCOUNT_ID>:policy/ShopFlowS3MediaAccess \
#     --approve
#
# ...where ShopFlowS3MediaAccess is an IAM policy you create granting
# s3:GetObject / s3:PutObject / s3:DeleteObject scoped to just your bucket's
# ARN (arn:aws:s3:::shopflow-product-images/*) - never a broader S3 policy
# than that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: shopflow
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::825765392987:role/prod-iac-product-service-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
  labels: { app: product-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          image: 825765392987.dkr.ecr.us-east-1.amazonaws.com/ms-product-rg
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets }
          env:
            - name: DB_NAME
              value: "productdb"
          readinessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  selector: { app: product-service }
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
