# Fill in real values and `kubectl apply -f` this BEFORE the deployments,
# or better: create it via `kubectl create secret generic ...` / External
# Secrets Operator pulling from AWS Secrets Manager instead of committing
# plaintext to git. Shown here as a template only.
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-secrets
  namespace: shopflow
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "REPLACE_ME"                 # RDS PostgreSQL master/user password
  DJANGO_SECRET_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"               # must match across all services
  INTERNAL_SERVICE_TOKEN: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopflow-config
  namespace: shopflow
data:
  # RDS PostgreSQL endpoint - one shared instance, one database per service (see README)
  DB_HOST: "shopflow-db.xxxxxxxxxx.eu-west-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "False"
  CORS_ALLOWED_ORIGINS: "https://main.xxxxxxx.amplifyapp.com"
  # In-cluster Service DNS (ClusterIP Services defined below)
  USER_SERVICE_URL: "http://user-service.shopflow.svc.cluster.local:8001"
  PRODUCT_SERVICE_URL: "http://product-service.shopflow.svc.cluster.local:8002"
  ORDER_SERVICE_URL: "http://order-service.shopflow.svc.cluster.local:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service.shopflow.svc.cluster.local:8004"
