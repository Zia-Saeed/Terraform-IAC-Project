# NOTE on product images: this Deployment runs 2 replicas, but the app
# code (see product-service/productservice/settings.py) stores uploaded
# images on local container disk. With multiple replicas behind one
# Service, an image uploaded via the pod that handled the admin request
# won't exist on the other pod's disk - some requests will 404. Before
# going to real production, swap local disk storage for S3 (django-storages'
# S3Boto3Storage) so every replica reads/writes the same bucket, and point
# PUBLIC_MEDIA_BASE_URL at that bucket/CloudFront domain instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
  labels: { app: product-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/shopflow/product-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets }
          env:
            - name: DB_NAME
              value: "productdb"
          readinessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  selector: { app: product-service }
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
