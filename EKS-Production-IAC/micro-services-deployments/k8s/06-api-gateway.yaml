apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopflow
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/shopflow/api-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets }
          readinessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopflow
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Requires the AWS Load Balancer Controller installed in the cluster.
# This provisions an internet-facing ALB that routes to api-gateway only -
# the frontend (on Amplify) is the sole caller; other services stay ClusterIP-only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopflow-ingress
  namespace: shopflow
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: api.shopflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
