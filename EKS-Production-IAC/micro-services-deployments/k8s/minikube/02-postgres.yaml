apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopflow
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopflow
spec:
  serviceName: postgres          # must match the headless Service above
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: shopflow-secrets }
          env:
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "userdb,productdb,orderdb,notifdb"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # avoids Postgres complaining about lost+found in the volume root
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
  # This is the StatefulSet-specific piece: instead of one PVC you create
  # and reference by name, Kubernetes stamps out a PVC from this template
  # for EACH replica (postgres-data-postgres-0, and postgres-data-postgres-1
  # if you scale to replicas: 2, etc.), using minikube's default
  # StorageClass to dynamically provision the underlying PersistentVolume.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi