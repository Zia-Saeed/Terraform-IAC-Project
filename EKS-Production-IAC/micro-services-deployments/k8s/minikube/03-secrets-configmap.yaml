# For real use, generate your own random values instead of the placeholders
# below - e.g. `openssl rand -hex 32` - and never commit real secrets to git.
# In a real cluster you'd manage this via `kubectl create secret` or an
# External Secrets Operator instead of a plaintext manifest; this is a
# template for local minikube use only.
apiVersion: v1
kind: Secret
metadata:
  name: shopflow-secrets
  namespace: shopflow
type: Opaque
stringData:
  # Read by the official postgres image itself (must use these exact names)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres-local-dev-pw"
  # Read by the Django services (same credentials, different var names -
  # see productservice/settings.py etc., which read DB_USER / DB_PASSWORD)
  DB_USER: "postgres"
  DB_PASSWORD: "postgres-local-dev-pw"
  DJANGO_SECRET_KEY: "minikube-django-secret-change-me"
  JWT_SECRET_KEY: "minikube-jwt-secret-change-me"        # must match across all 5 services
  INTERNAL_SERVICE_TOKEN: "minikube-internal-token-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopflow-config
  namespace: shopflow
data:
  DB_HOST: "postgres"          # in-cluster Service name, same namespace - no RDS in minikube
  DB_PORT: "5432"
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "True"     # loosened for local minikube testing; tighten for anything shared
  # In-cluster Service DNS - Kubernetes resolves the short name within the
  # same namespace, no need for the full *.svc.cluster.local form here
  USER_SERVICE_URL: "http://user-service:8001"
  PRODUCT_SERVICE_URL: "http://product-service:8002"
  ORDER_SERVICE_URL: "http://order-service:8003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8004"
  # This one MUST be reachable from your browser, not just from inside the
  # cluster - fill it in with the URL `minikube service product-service -n
  # shopflow --url` prints, AFTER you've deployed 06-product-service.yaml
  # (see the step-by-step guide). Update this ConfigMap and roll product-service
  # once you have that URL: kubectl rollout restart deployment/product-service -n shopflow
  PUBLIC_MEDIA_BASE_URL: "http://REPLACE-WITH-MINIKUBE-SERVICE-URL"
